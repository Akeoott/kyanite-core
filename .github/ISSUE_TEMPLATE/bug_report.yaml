name: Bug Report
description: Report an issue to help the project improve.
title: "[Bug] "
labels: ["type/Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search open and closed issues before submitting a new one.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug/issue is.
    validations:
      required: true

  - type: checkboxes
    id: regression
    attributes:
      label: Is this a regression?
      description: Did this behavior used to work in a previous version?
      options:
        - label: Yes, this worked in a previous version
        - label: No, this has never worked
        - label: Unsure

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: A clear and concise description of what is actually happening.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps to reproduce the error (add or remove as many steps as needed).
      placeholder: |
        1.
        2.
        3.
        4.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g. Ubuntu 24.04 x86_64 / Windows 11 23H2
      placeholder: "Ubuntu 24.04 x86_64"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Application version
      description: e.g. v1.1.0, commit hash, or `main`
      placeholder: "v1.1.0"
    validations:
      required: true

  - type: upload
    id: screenshots-logs
    attributes:
      label: Screenshots / Logs
      description: If applicable, add logs, screenshots, or videos to help explain your problem.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
